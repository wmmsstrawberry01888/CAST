[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cast"
version = "1.0.0"
description = "CAST: Causality-guided flight-parameter prediction across heterogeneous atmospheric conditions"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "CAST Authors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "pyyaml>=6.0",
    "easydict>=1.9",
    "matplotlib>=3.5",
    "tensorboard>=2.10",
    "dtaidistance>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cast-train = "run:main"

[tool.setuptools]
# run.py / batch_run.py are top-level modules (not inside a package), so they
# must be listed explicitly for the console script and imports to resolve after
# an editable install.
py-modules = ["run", "batch_run"]

[tool.setuptools.packages.find]
include = ["model*", "models*", "layers*", "algorithm*", "utils*", "engine*"]
